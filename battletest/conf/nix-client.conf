# Client-side nix.conf (branch nix). Both experimental features on.
# max-jobs = 0 forces every build through the remote-build hook.
experimental-features = nix-command flakes serve-build-logs build-coordinator
sandbox = false
build-users-group =
substituters =
trusted-public-keys =
max-jobs = 0
builders = @/etc/nix/machines
builders-use-substitutes = false
connect-timeout = 10
