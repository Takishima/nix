"$schema": "http://json-schema.org/draft-04/schema"
"$id": "https://nix.dev/manual/nix/latest/protocols/json/schema/build-result-v1.json"
title: Build Result
description: |
  This schema describes the JSON representation of Nix's `BuildResult` type, which represents the result of building a derivation or substituting store paths.

  Build results can represent either successful builds (with built outputs) or various types of failures.

oneOf:
  - "$ref": "#/$defs/success"
  - "$ref": "#/$defs/failure"
type: object
required:
  - success
  - status
properties:
  timesBuilt:
    type: integer
    minimum: 0
    title: Times built
    description: |
      How many times this build was performed.

  startTime:
    type: integer
    minimum: 0
    title: Start time
    description: |
      The start time of the build (or one of the rounds, if it was repeated), as a Unix timestamp.

  stopTime:
    type: integer
    minimum: 0
    title: Stop time
    description: |
      The stop time of the build (or one of the rounds, if it was repeated), as a Unix timestamp.

  cpuUser:
    type: integer
    minimum: 0
    title: User CPU time
    description: |
      User CPU time the build took, in microseconds.

  cpuSystem:
    type: integer
    minimum: 0
    title: System CPU time
    description: |
      System CPU time the build took, in microseconds.

  logRef:
    type: string
    title: Build log reference
    description: |
      The derivation path under which the builder that produced this result
      persisted the build log, so the full log can be fetched with
      `nix log --store <builder> <logRef>`.

      > **Note**
      >
      > Part of the structured build diagnostics, which are still
      > experimental: present only when produced by a Nix with the
      > `serve-build-logs` / `build-log-query-1` features. Absent when unknown.

  failurePhase:
    type: string
    title: Failed phase
    description: |
      For a failure, the build phase that failed (e.g. `build`), if known.

      > **Note**
      >
      > Part of the experimental structured build diagnostics; absent when
      > unknown.

  exitCode:
    type: integer
    title: Builder exit status
    description: |
      For a failure, the builder's exit status (in `wait(2)` encoding), if
      the builder ran. Absent (or 0) when not applicable.

      > **Note**
      >
      > Part of the experimental structured build diagnostics.

  logTail:
    type: string
    title: Build log tail
    description: |
      For a failure, the last lines of the build log, so the failure can be
      inspected without fetching the full log.

      > **Note**
      >
      > Part of the experimental structured build diagnostics; absent when
      > unknown.

  deduplicated:
    type: boolean
    title: Deduplicated
    description: |
      Whether this result was produced by a build the requesting session
      *attached to* rather than started — i.e. it was coalesced onto an
      in-flight build of the same resolved derivation. Absent means `false`.

      > **Note**
      >
      > Part of the experimental `build-coordinator` feature.

  builderId:
    type: string
    title: Builder identifier
    description: |
      An opaque identifier of the builder that actually produced this result
      (e.g. which node in an elastic fleet). Purely informational; absent
      when unknown.

      > **Note**
      >
      > Part of the experimental structured build diagnostics.

  failureClass:
    type: string
    title: Failure classification
    description: |
      How a failure should be classified *for retry*, orthogonal to the exit
      code: whether the failure is a property of the derivation
      (`BuildError`) or of where it ran (all other values, e.g. an
      out-of-memory kill). Absent means `BuildError` (build-intrinsic).

      > **Note**
      >
      > Part of the experimental structured build diagnostics.
    enum:
      - "BuildError"
      - "ResourceExhausted"
      - "Evicted"
      - "Infra"

  killedForMemory:
    type: boolean
    title: Killed for memory
    description: |
      Whether the builder was killed for exceeding memory (e.g. by the
      kernel out-of-memory killer), when known. Refines a
      `ResourceExhausted` failure so a scheduler can right-size a retry.
      Absent means `false` / unknown.

      > **Note**
      >
      > Part of the experimental structured build diagnostics.

  peakMemoryBytes:
    type: integer
    minimum: 0
    title: Peak memory use
    description: |
      Peak memory use of the build in bytes, when measured (from the
      build's cgroup, where one is used). Absent when unmeasured;
      meaningful for successful builds too.

      > **Note**
      >
      > Part of the experimental structured build diagnostics.

"$defs":
  success:
    type: object
    title: Successful Build Result
    description: |
      Represents a successful build with built outputs.
    required:
      - success
      - status
      - builtOutputs
    properties:
      success:
        const: true
        title: Success indicator
        description: |
          Always true for successful build results.

      status:
        type: string
        title: Success status
        description: |
          Status string for successful builds.
        enum:
          - "Built"
          - "Substituted"
          - "AlreadyValid"
          - "ResolvesToAlreadyValid"

      builtOutputs:
        type: object
        title: Built outputs
        description: |
          A mapping from output names to their build trace entries.
        additionalProperties:
          "$ref": "build-trace-entry-v3.yaml#/$defs/value"

  failure:
    type: object
    title: Failed Build Result
    description: |
      Represents a failed build with error information.
    required:
      - success
      - status
      - errorMsg
    properties:
      success:
        const: false
        title: Success indicator
        description: |
          Always false for failed build results.

      status:
        type: string
        title: Failure status
        description: |
          Status string for failed builds.
        enum:
          - "PermanentFailure"
          - "InputRejected"
          - "OutputRejected"
          - "TransientFailure"
          - "CachedFailure"
          - "TimedOut"
          - "MiscFailure"
          - "DependencyFailed"
          - "LogLimitExceeded"
          - "NotDeterministic"
          - "NoSubstituters"
          - "HashMismatch"

      errorMsg:
        type: string
        title: Error message
        description: |
          Information about the error if the build failed.

      isNonDeterministic:
        type: boolean
        title: Non-deterministic flag
        description: |
          If timesBuilt > 1, whether some builds did not produce the same result.

          Note that 'isNonDeterministic = false' does not mean the build is deterministic,
          just that we don't have evidence of non-determinism.
